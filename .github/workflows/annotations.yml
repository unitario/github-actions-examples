name: annotations
on: workflow_dispatch
jobs:
  annotations:
    name: ${{ matrix.annotation }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        annotation: [notice, warning, error]
    steps:
      - name: annotations
        run: |
          echo "::${{ matrix.annotation }}::${{ matrix.annotation }}"
          echo "::${{ matrix.annotation }} title=title::${{ matrix.annotation }} title=title"
          echo "::${{ matrix.annotation }} title=title,file=example.ts::${{ matrix.annotation }} title=title,file=example.ts"
          echo "::${{ matrix.annotation }} title=title,file=example.ts,col=7,line=5::${{ matrix.annotation }} title=title,file=example.ts,col=7,line=5"
          echo "::${{ matrix.annotation }} title=title,file=example.ts,col=7,endColumn=10,line=5,endLine=7::${{ matrix.annotation }} title=title,file=example.ts,col=7,endColumn=10,line=5,endLine=7"
