name: annotations multiline
on: workflow_dispatch
jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - name: multiline
        run: |
          echo "::warning::line 1%0Aline 2%0Aline 3"
          echo "::warning title=multiline,file=example.ts,line=5::line 1%0Aline 2%0Aline 3"
          echo "::warning title=indent,file=example.ts,line=5::first%0A  indented%0A    more indented"
          echo "::warning title=empty line,file=example.ts,line=5::before%0A%0Aafter"
      - name: links
        run: |
          echo "::warning::plain link https://docs.github.com/en/actions"
          echo "::warning::markdown link [docs](https://docs.github.com/en/actions)"
          echo "::warning::html link <a href=\"https://docs.github.com/en/actions\">docs</a>"
          echo "::warning title=https://docs.github.com/en/actions::link in the title"
          echo "::warning title=link,file=example.ts,line=5::see https://docs.github.com/en/actions%0Aand https://github.com/actions/toolkit"
      - name: bundle
        run: |
          echo "::error title=3 problems,file=example.ts,line=5::example.ts:5:7 warning no-unused-vars%0Aexample.ts:8:1 error no-undef%0Aexample.ts:10:3 warning prefer-const"
      - name: bundle 30 lines
        run: |
          message=""
          for i in $(seq 1 30); do message="$message%0Aexample.ts:$i:1 warning problem $i"; done
          echo "::error title=30 problems,file=example.ts,line=5::${message#%0A}"
